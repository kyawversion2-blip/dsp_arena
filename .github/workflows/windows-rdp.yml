name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Enable Remote Desktop & Configure Registry
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User Account
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "RDPUser" -Password $Password -Description "Automated RDP User" -PasswordNeverExpires
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"

      - name: Install and Authenticate Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="gh-rdp-runner" --accept-routes

      - name: Check Tailscale Status
        shell: powershell
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Output "Tailscale IP : $ip"
          Write-Output "Hostname     : gh-rdp-runner"
          Write-Output "RDP Username : RDPUser"
          Write-Output ""
          Write-Output "RDP Server is READY - keep this job ALIVE"

      - name: Keep Runner Alive (12 minutes for RDP connection)
        shell: powershell
        run: |
          # Hostname the runner publishes as on the tailnet: gh-rdp-runner
          # The IP is available from the Mac's Tailscale app (see gh-rdp-runner device)
          $deadline = (Get-Date).AddMinutes(12)
          while ((Get-Date) -lt $deadline) {
            Write-Output "RDP server alive until $deadline ... (connect now from Tailscale app)"
            Start-Sleep -Seconds 30
          }
          Write-Output "Session window ended."
